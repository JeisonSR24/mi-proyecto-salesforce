<template>
    <lightning-card title="Contact List" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            
            <template lwc:if={error}>
                <div class="slds-box slds-theme_error slds-text-color_destructive slds-m-bottom_medium">
                    <p class="slds-text-heading_small slds-m-bottom_x-small">Error al cargar contactos:</p>
                    <ul>
                        <template for:each={errors} for:item="err">
                            <li key={err}>{err}</li>
                        </template>
                    </ul>
                </div>
            </template>
            
            <template lwc:if={contacts}>
                <lightning-datatable
                    key-field="Id"
                    data={contacts}
                    columns={columns}
                    hide-checkbox-column="true"
                    show-row-number-column="true">
                </lightning-datatable>
            </template>
            
            <template lwc:if={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
